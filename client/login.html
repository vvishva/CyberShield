<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CyberShield AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: "";
      position: absolute;
      top: -50px; left: -50px; right: -50px; height: 150px;
      background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.15), transparent 70%);
      pointer-events: none;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-brand i {
      font-size: 42px;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .auth-brand h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .input-group {
      position: relative;
    }
    .input-group .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 22, 40, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 40px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s var(--ease);
      font-family: 'Inter', sans-serif;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(15, 22, 40, 0.9);
    }
    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
    }
    .eye-icon:hover { color: var(--cyan); }
    .auth-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .forgot-link {
      color: var(--cyan);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }
    .auth-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .guest-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border-subtle);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 20px;
        border: none;
        box-shadow: none;
        background: transparent;
      }
      body {
        padding: 0;
        align-items: flex-start;
        padding-top: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <i class="fas fa-shield-halved"></i>
      <h2>CyberShield Gateway</h2>
      <p>Enter your credentials to access the SOC</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="login-email" class="form-control" placeholder="analyst@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <i class="fas fa-eye eye-icon" id="toggle-pwd"></i>
        </div>
      </div>

      <div class="auth-extras">
        <label class="remember-label">
          <input type="checkbox" id="login-remember"> Remember me
        </label>
        <a href="#" class="forgot-link" onclick="showToast('Password reset email sent!','info'); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary auth-btn" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Authenticate & Enter
      </button>

      <div class="divider">or</div>

      <button type="button" id="guest-btn" class="btn btn-secondary guest-btn">
        <i class="fas fa-eye"></i> Continue as Guest
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create Account</a>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in
      if(getToken() && getUser()) {
        window.location.href = 'dashboard.html';
      }

      // Toggle Password Visibility
      document.getElementById('toggle-pwd').addEventListener('click', function() {
        const input = document.getElementById('login-password');
        if (input.type === 'password') {
          input.type = 'text';
          this.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          this.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });

      // Guest Login
      document.getElementById('guest-btn').addEventListener('click', async () => {
        const btn = document.getElementById('guest-btn');
        btn.classList.add('btn-loading');
        btn.disabled = true;
        
        try {
          const data = await apiRequest('/auth/login', 'POST', {
            email: 'guest@cybershield.io',
            password: 'guest'
          });
          
          if (data.success && data.token) {
            setToken(data.token, false);
            if (data.user) setUser(data.user, false);
            btn.innerHTML = '<i class="fas fa-check"></i> Welcome Guest!';
            btn.style.background = 'linear-gradient(135deg,#00c896,#00a077)';
            showToast('Logging in as guest...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-eye"></i> Continue as Guest';
          showToast(err.message || 'Guest Login failed.', 'danger');
        }
      });

      // Login Form Submit
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;

        if (!email || !password) {
          showToast('Please enter both email and password', 'warning');
          return;
        }

        btn.classList.add('btn-loading');
        btn.disabled = true;

        try {
          const data = await apiRequest('/auth/login', 'POST', { email, password });
          if (data.success && data.token) {
            setToken(data.token, remember);
            if (data.user) setUser(data.user, remember);
            btn.innerHTML = '<i class="fas fa-check"></i> Authenticated!';
            btn.style.background = 'linear-gradient(135deg,#00c896,#00a077)';
            showToast('Welcome back! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Authenticate & Enter';
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Login failed', 'danger');
        }
      });
    });
  </script>
</body>
</html>
