<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: "";
      position: absolute;
      top: -50px; left: -50px; right: -50px; height: 150px;
      background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.15), transparent 70%);
      pointer-events: none;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-brand i {
      font-size: 42px;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .auth-brand h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .input-group {
      position: relative;
    }
    .input-group .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 22, 40, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 40px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s var(--ease);
      font-family: 'Inter', sans-serif;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(15, 22, 40, 0.9);
    }
    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
    }
    .eye-icon:hover { color: var(--cyan); }
    .auth-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 24px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 20px;
        border: none;
        box-shadow: none;
        background: transparent;
      }
      body {
        padding: 0;
        align-items: flex-start;
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <i class="fas fa-user-plus"></i>
      <h2>Create Account</h2>
      <p>Register as a new CyberShield Security Analyst</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-group">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="reg-username" class="form-control" placeholder="SecurityAnalyst" required minlength="3">
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="reg-email" class="form-control" placeholder="analyst@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
          <i class="fas fa-eye eye-icon" id="toggle-pwd1"></i>
        </div>
      </div>
      
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-group">
          <i class="fas fa-check-double input-icon"></i>
          <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required>
          <i class="fas fa-eye eye-icon" id="toggle-pwd2"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-btn" id="reg-btn">
        <i class="fas fa-shield-check"></i> Initialize Account
      </button>
    </form>

    <form id="otp-form" style="display: none;">
      <div class="form-group">
        <label>Security OTP</label>
        <div class="input-group">
          <i class="fas fa-key input-icon"></i>
          <input type="text" id="reg-otp" class="form-control" placeholder="123456" required maxlength="6" pattern="\d{6}">
        </div>
        <small style="color: var(--text-muted); display: block; margin-top: 8px;" id="otp-sent-notice">A 6-digit verification code has been sent to your email.</small>
      </div>

      <button type="submit" class="btn btn-primary auth-btn" id="otp-btn">
        <i class="fas fa-unlock-keyhole"></i> Verify Account
      </button>
      
      <div style="display: flex; gap: 10px; margin-top: 12px;">
        <button type="button" class="btn btn-secondary" id="resend-otp-btn" style="flex: 1; padding: 12px; font-size: 13px;">
          <i class="fas fa-rotate"></i> Resend OTP <span id="cooldown-timer">(60s)</span>
        </button>
        <button type="button" class="btn btn-secondary" id="change-email-btn" style="flex: 1; padding: 12px; font-size: 13px;">
          <i class="fas fa-pen"></i> Change Email
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already registered? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if(getToken() && getUser()) {
        window.location.href = 'dashboard.html';
      }

      // Password toggles
      const setupToggle = (toggleId, inputId) => {
        document.getElementById(toggleId).addEventListener('click', function() {
          const input = document.getElementById(inputId);
          if (input.type === 'password') {
            input.type = 'text';
            this.classList.replace('fa-eye', 'fa-eye-slash');
          } else {
            input.type = 'password';
            this.classList.replace('fa-eye-slash', 'fa-eye');
          }
        });
      };
      
      setupToggle('toggle-pwd1', 'reg-password');
      setupToggle('toggle-pwd2', 'reg-confirm');

      let registeredEmail = '';
      let timerInterval = null;

      const startResendTimer = (seconds = 60) => {
        const btn = document.getElementById('resend-otp-btn');
        const timerSpan = document.getElementById('cooldown-timer');
        btn.disabled = true;
        let remaining = seconds;
        
        if (timerInterval) clearInterval(timerInterval);
        
        timerSpan.innerText = `(${remaining}s)`;
        timerInterval = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timerInterval);
            timerSpan.innerText = '';
            btn.disabled = false;
          } else {
            timerSpan.innerText = `(${remaining}s)`;
          }
        }, 1000);
      };

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;

        if (password !== confirm) {
          showToast('Passwords do not match', 'warning');
          return;
        }

        btn.classList.add('btn-loading');
        btn.disabled = true;

        try {
          const data = await apiRequest('/auth/register', 'POST', { username, email, password });
          if (data.success) {
            registeredEmail = email;
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('otp-form').style.display = 'block';
            document.querySelector('.auth-brand p').innerText = `Enter the 6-digit code sent to ${email}`;
            document.getElementById('otp-sent-notice').innerText = `A 6-digit code has been sent to ${email}`;
            showToast(data.message || 'Verification code sent successfully to your email.', 'success');
            startResendTimer(60);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Unable to send verification code. Please try again.', 'danger');
        }
      });

      document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('otp-btn');
        const otp = document.getElementById('reg-otp').value.trim();

        btn.classList.add('btn-loading');
        btn.disabled = true;

        try {
          const data = await apiRequest('/auth/verify-otp', 'POST', { email: registeredEmail, otp });
          if (data.success && data.token) {
            setToken(data.token, false);
            if (data.user) setUser(data.user, false);
            btn.innerHTML = '<i class="fas fa-check"></i> Verified!';
            btn.style.background = 'linear-gradient(135deg,#00c896,#00a077)';
            showToast('Account verified! Accessing SOC...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Invalid verification code.', 'danger');
        }
      });

      document.getElementById('resend-otp-btn').addEventListener('click', async () => {
        const btn = document.getElementById('resend-otp-btn');
        btn.classList.add('btn-loading');
        btn.disabled = true;
        try {
          const resData = await apiRequest('/auth/resend-otp', 'POST', { email: registeredEmail });
          showToast(resData.message || 'Verification code sent successfully to your email.', 'success');
          startResendTimer(60);
        } catch (err) {
          showToast(err.message || 'Unable to send verification code. Please try again.', 'danger');
          btn.disabled = false;
        } finally {
          btn.classList.remove('btn-loading');
        }
      });

      document.getElementById('change-email-btn').addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('otp-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.querySelector('.auth-brand p').innerText = 'Register as a new CyberShield Security Analyst';
        const regBtn = document.getElementById('reg-btn');
        regBtn.classList.remove('btn-loading');
        regBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
