<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 36px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: "";
      position: absolute;
      top: -50px; left: -50px; right: -50px; height: 150px;
      background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.15), transparent 70%);
      pointer-events: none;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-brand i {
      font-size: 42px;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .auth-brand h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 6px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group { position: relative; }
    .input-group .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 22, 40, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 40px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(15, 22, 40, 0.9);
    }
    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
      font-size: 13px;
    }
    .eye-icon:hover { color: var(--cyan); }

    /* ── 6-Digit OTP Box Grid ── */
    .otp-box-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 18px 0 10px 0;
    }
    .otp-digit-box {
      width: 44px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #00d4ff;
      background: rgba(15, 22, 40, 0.8);
      border: 1.5px solid var(--border-subtle, rgba(0, 212, 255, 0.2));
      border-radius: var(--radius-md);
      box-sizing: border-box;
      font-family: 'Inter', monospace;
      transition: all 0.2s ease;
    }
    .otp-digit-box:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
      background: rgba(15, 22, 40, 0.95);
    }

    .auth-btn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 16px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .otp-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .otp-actions button {
      flex: 1;
      padding: 11px 8px;
      font-size: 12px;
      border-radius: var(--radius-md);
    }

    .otp-notice {
      color: var(--text-muted);
      font-size: 12px;
      display: block;
      margin-top: 6px;
      line-height: 1.5;
      text-align: center;
    }

    .success-alert-banner {
      background: rgba(0, 200, 150, 0.15);
      border: 1px solid rgba(0, 200, 150, 0.35);
      color: #00c896;
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; padding-top: 20px; }
      .auth-card { padding: 28px 20px; border: none; box-shadow: none; background: transparent; }
      .otp-digit-box { width: 38px; height: 46px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <i class="fas fa-user-plus"></i>
      <h2>Create Account</h2>
      <p id="brand-subtitle">Register as a new CyberShield Security Analyst</p>
    </div>

    <!-- ════════════════════════════════════════════
         EMAIL REGISTRATION FORMS
    ═══════════════════════════════════════════════ -->
    <div id="email-section">
      <!-- Step 1: Email Registration -->
      <form id="register-form">
        <div class="form-group">
          <label>Username / Name</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="reg-username" class="form-control" placeholder="SecurityAnalyst" required minlength="3" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="analyst@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-pwd1"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-group">
            <i class="fas fa-check-double input-icon"></i>
            <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-pwd2"></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="reg-btn">
          <i class="fas fa-paper-plane"></i> Generate OTP
        </button>
      </form>

      <!-- Step 2: Email OTP Verification -->
      <form id="otp-form" style="display: none;">
        <div class="success-alert-banner" id="verified-banner">
          <i class="fas fa-circle-check"></i> ✓ Email verified successfully
        </div>
        <div class="form-group">
          <label style="text-align:center; display:block;">Enter Security OTP Code</label>
          
          <!-- 6-digit OTP input grid: [ _ ][ _ ][ _ ][ _ ][ _ ][ _ ] -->
          <div class="otp-box-container" id="otp-grid">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="0" inputmode="numeric" pattern="\d" autocomplete="one-time-code">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="1" inputmode="numeric" pattern="\d">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="2" inputmode="numeric" pattern="\d">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="3" inputmode="numeric" pattern="\d">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="4" inputmode="numeric" pattern="\d">
            <input type="text" maxlength="1" class="otp-digit-box" data-index="5" inputmode="numeric" pattern="\d">
          </div>
          
          <small class="otp-notice" id="otp-sent-notice">Verification code sent to your email.</small>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="otp-btn">
          <i class="fas fa-unlock-keyhole"></i> Verify &amp; Complete Registration
        </button>
        <div class="otp-actions">
          <button type="button" class="btn btn-secondary" id="resend-otp-btn">
            <i class="fas fa-rotate"></i> Resend OTP <span id="cooldown-timer">(60s)</span>
          </button>
          <button type="button" class="btn btn-secondary" id="change-email-btn">
            <i class="fas fa-pen"></i> Change Email
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Already registered? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (getToken() && getUser()) {
        window.location.href = 'dashboard.html';
      }

      const setupToggle = (toggleId, inputId) => {
        const el = document.getElementById(toggleId);
        if (!el) return;
        el.addEventListener('click', function () {
          const input = document.getElementById(inputId);
          if (input.type === 'password') {
            input.type = 'text';
            this.classList.replace('fa-eye', 'fa-eye-slash');
          } else {
            input.type = 'password';
            this.classList.replace('fa-eye-slash', 'fa-eye');
          }
        });
      };

      setupToggle('toggle-pwd1', 'reg-password');
      setupToggle('toggle-pwd2', 'reg-confirm');

      let pendingEmail = '';
      let cooldownInterval = null;

      function startCooldownTimer(seconds = 60) {
        const resendBtn = document.getElementById('resend-otp-btn');
        const timerSpan = document.getElementById('cooldown-timer');
        if (!resendBtn || !timerSpan) return;

        resendBtn.disabled = true;
        let remaining = seconds;
        timerSpan.textContent = `(${remaining}s)`;

        if (cooldownInterval) clearInterval(cooldownInterval);
        cooldownInterval = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(cooldownInterval);
            resendBtn.disabled = false;
            timerSpan.textContent = '';
          } else {
            timerSpan.textContent = `(${remaining}s)`;
          }
        }, 1000);
      }

      // ── 6-Digit OTP Box Grid Auto-Advance Logic ──
      const otpBoxes = Array.from(document.querySelectorAll('.otp-digit-box'));
      
      function getCombinedOTP() {
        return otpBoxes.map(b => b.value.trim()).join('');
      }

      function clearOTPBoxes() {
        otpBoxes.forEach(b => { b.value = ''; });
        if (otpBoxes[0]) otpBoxes[0].focus();
      }

      otpBoxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val ? val.slice(-1) : '';
          
          if (val && idx < otpBoxes.length - 1) {
            otpBoxes[idx + 1].focus();
          }

          // Auto-submit when all 6 digits entered
          if (getCombinedOTP().length === 6) {
            document.getElementById('otp-form').dispatchEvent(new Event('submit'));
          }
        });

        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            otpBoxes[idx - 1].focus();
          }
        });

        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
          pasted.split('').forEach((ch, i) => {
            if (otpBoxes[i]) otpBoxes[i].value = ch;
          });
          if (pasted.length === 6) {
            otpBoxes[5].focus();
            document.getElementById('otp-form').dispatchEvent(new Event('submit'));
          } else if (otpBoxes[pasted.length]) {
            otpBoxes[pasted.length].focus();
          }
        });
      });

      // Step 1: Generate OTP
      const registerForm = document.getElementById('register-form');
      if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('reg-username').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const password = document.getElementById('reg-password').value;
          const confirm = document.getElementById('reg-confirm').value;

          if (password !== confirm) {
            showToast('Passwords do not match', 'danger');
            return;
          }

          const btn = document.getElementById('reg-btn');
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating OTP...';

          try {
            const data = await apiRequest('/auth/register', 'POST', { username, email, password });
            if (data.success) {
              pendingEmail = email;
              showToast('Verification code sent to your email.', 'success');
              document.getElementById('register-form').style.display = 'none';
              document.getElementById('otp-form').style.display = 'block';
              document.getElementById('otp-sent-notice').textContent = `Verification code sent to ${email}.`;
              clearOTPBoxes();
              startCooldownTimer(60);
            } else {
              showToast(data.error || 'Unable to send verification code. Please try again.', 'danger');
            }
          } catch (err) {
            showToast(err.message || 'Unable to send verification code. Please try again.', 'danger');
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Generate OTP';
          }
        });
      }

      // Step 2: Verify OTP
      const otpForm = document.getElementById('otp-form');
      if (otpForm) {
        otpForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const otp = getCombinedOTP();
          if (!otp || otp.length !== 6) {
            showToast('Please enter a 6-digit OTP code', 'warning');
            return;
          }

          const btn = document.getElementById('otp-btn');
          if (btn.disabled) return; // Prevent double submit
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

          try {
            const data = await apiRequest('/auth/verify-otp', 'POST', { email: pendingEmail, otp });
            if (data.success) {
              const banner = document.getElementById('verified-banner');
              if (banner) banner.style.display = 'block';
              showToast('✓ Email verified successfully', 'success');
              setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
              showToast(data.error || 'Invalid verification code.', 'danger');
              clearOTPBoxes();
            }
          } catch (err) {
            showToast(err.message || 'Invalid verification code.', 'danger');
            clearOTPBoxes();
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-unlock-keyhole"></i> Verify &amp; Complete Registration';
          }
        });
      }

      // Resend OTP
      const resendBtn = document.getElementById('resend-otp-btn');
      if (resendBtn) {
        resendBtn.addEventListener('click', async () => {
          if (!pendingEmail) return;
          resendBtn.disabled = true;
          try {
            const data = await apiRequest('/auth/resend-otp', 'POST', { email: pendingEmail });
            if (data.success) {
              showToast('Verification code sent to your email.', 'success');
              clearOTPBoxes();
              startCooldownTimer(60);
            } else {
              showToast(data.error || 'Unable to send verification code. Please try again.', 'danger');
              resendBtn.disabled = false;
            }
          } catch (err) {
            showToast(err.message || 'Unable to send verification code. Please try again.', 'danger');
            resendBtn.disabled = false;
          }
        });
      }

      // Change Email
      const changeEmailBtn = document.getElementById('change-email-btn');
      if (changeEmailBtn) {
        changeEmailBtn.addEventListener('click', () => {
          document.getElementById('otp-form').style.display = 'none';
          document.getElementById('register-form').style.display = 'block';
          if (cooldownInterval) clearInterval(cooldownInterval);
        });
      }
    });
  </script>
</body>
</html>
