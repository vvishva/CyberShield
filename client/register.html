<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account – CyberShield AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=3.0">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0;">

  <div class="glass-card auth-box" style="max-width: 480px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <i class="fas fa-user-shield" style="font-size: 42px; color: var(--neon-cyan); filter: drop-shadow(0 0 12px var(--neon-cyan));"></i>
      <h2 style="font-size: 24px; font-weight: 700; margin-top: 12px;">Create CyberShield Account</h2>
      <p style="color: var(--text-muted); font-size: 13px;">Register to monitor threat intelligence and generate reports</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full Username</label>
        <input type="text" id="reg-username" class="form-control" placeholder="SecAnalyst_Dave" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Work Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="analyst@company.com" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-check-double"></i> Confirm Password</label>
        <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
        <i class="fas fa-user-plus"></i> Create Security Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
      Already registered? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
