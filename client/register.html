<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .auth-card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 36px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: "";
      position: absolute;
      top: -50px; left: -50px; right: -50px; height: 150px;
      background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.15), transparent 70%);
      pointer-events: none;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-brand i {
      font-size: 40px;
      color: var(--cyan);
      margin-bottom: 10px;
    }
    .auth-brand h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 6px;
    }

    /* ── Method Selector Tabs ── */
    .method-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
    }
    .method-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 8px;
      border-radius: calc(var(--radius-md) - 2px);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .method-tab:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.05);
    }
    .method-tab.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.08));
      color: var(--cyan);
      border: 1px solid rgba(0,212,255,0.25);
    }
    .method-tab i { font-size: 14px; }

    /* ── Form ── */
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group { position: relative; }
    .input-group .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 22, 40, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 40px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(15, 22, 40, 0.9);
    }
    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
      font-size: 13px;
    }
    .eye-icon:hover { color: var(--cyan); }

    /* ── Phone Row (country code + number) ── */
    .phone-row {
      display: flex;
      gap: 8px;
    }
    .country-select-wrap {
      position: relative;
      flex: 0 0 110px;
    }
    .country-select-wrap .input-icon {
      left: 10px;
      font-size: 12px;
    }
    .form-control.country-select {
      padding-left: 30px;
      padding-right: 8px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      font-size: 13px;
    }
    .phone-number-wrap {
      flex: 1;
      position: relative;
    }
    .phone-number-wrap .form-control {
      padding-left: 14px;
    }

    /* ── Buttons ── */
    .auth-btn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 20px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .otp-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .otp-actions button {
      flex: 1;
      padding: 11px 8px;
      font-size: 12px;
      border-radius: var(--radius-md);
    }

    /* ── OTP helper text ── */
    .otp-notice {
      color: var(--text-muted);
      font-size: 12px;
      display: block;
      margin-top: 7px;
      line-height: 1.5;
    }

    /* ── Footer ── */
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; padding-top: 20px; }
      .auth-card { padding: 28px 20px; border: none; box-shadow: none; background: transparent; }
      .method-tab { font-size: 12px; padding: 9px 6px; }
      .country-select-wrap { flex: 0 0 95px; }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <i class="fas fa-user-plus"></i>
      <h2>Create Account</h2>
      <p id="brand-subtitle">Register as a new CyberShield Security Analyst</p>
    </div>

    <!-- ── Method Selector Tabs ── -->
    <div class="method-tabs" id="method-tabs">
      <button class="method-tab active" id="tab-email" onclick="switchMethod('email')">
        <i class="fas fa-envelope"></i> Email Registration
      </button>
      <button class="method-tab" id="tab-phone" onclick="switchMethod('phone')">
        <i class="fas fa-mobile-screen-button"></i> Mobile Registration
      </button>
    </div>

    <!-- ════════════════════════════════════════════
         EMAIL REGISTRATION FORMS (existing flow)
    ═══════════════════════════════════════════════ -->
    <div id="email-section">
      <!-- Step 1: Email Registration -->
      <form id="register-form">
        <div class="form-group">
          <label>Username</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="reg-username" class="form-control" placeholder="SecurityAnalyst" required minlength="3" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="analyst@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-pwd1"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-group">
            <i class="fas fa-check-double input-icon"></i>
            <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-pwd2"></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="reg-btn">
          <i class="fas fa-paper-plane"></i> Send Email OTP
        </button>
      </form>

      <!-- Step 2: Email OTP Verification -->
      <form id="otp-form" style="display: none;">
        <div class="form-group">
          <label>Security OTP</label>
          <div class="input-group">
            <i class="fas fa-key input-icon"></i>
            <input type="text" id="reg-otp" class="form-control" placeholder="123456" required maxlength="6" pattern="\d{6}" inputmode="numeric" autocomplete="one-time-code">
          </div>
          <small class="otp-notice" id="otp-sent-notice">A 6-digit verification code has been sent to your email.</small>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="otp-btn">
          <i class="fas fa-unlock-keyhole"></i> Verify Account
        </button>
        <div class="otp-actions">
          <button type="button" class="btn btn-secondary" id="resend-otp-btn">
            <i class="fas fa-rotate"></i> Resend OTP <span id="cooldown-timer">(60s)</span>
          </button>
          <button type="button" class="btn btn-secondary" id="change-email-btn">
            <i class="fas fa-pen"></i> Change Email
          </button>
        </div>
      </form>
    </div>

    <!-- ════════════════════════════════════════════
         PHONE REGISTRATION FORMS (new)
    ═══════════════════════════════════════════════ -->
    <div id="phone-section" style="display: none;">
      <!-- Step 1: Phone Registration -->
      <form id="register-phone-form">
        <div class="form-group">
          <label>Username</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="phone-username" class="form-control" placeholder="SecurityAnalyst" required minlength="3" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <div class="phone-row">
            <div class="country-select-wrap">
              <i class="fas fa-flag input-icon"></i>
              <select id="country-code" class="form-control country-select" aria-label="Country code">
                <option value="+91">🇮🇳 +91</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+81">🇯🇵 +81</option>
                <option value="+86">🇨🇳 +86</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+39">🇮🇹 +39</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+7">🇷🇺 +7</option>
                <option value="+55">🇧🇷 +55</option>
                <option value="+52">🇲🇽 +52</option>
                <option value="+82">🇰🇷 +82</option>
                <option value="+65">🇸🇬 +65</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+92">🇵🇰 +92</option>
                <option value="+880">🇧🇩 +880</option>
                <option value="+94">🇱🇰 +94</option>
                <option value="+60">🇲🇾 +60</option>
                <option value="+62">🇮🇩 +62</option>
                <option value="+63">🇵🇭 +63</option>
                <option value="+66">🇹🇭 +66</option>
                <option value="+84">🇻🇳 +84</option>
                <option value="+234">🇳🇬 +234</option>
                <option value="+27">🇿🇦 +27</option>
                <option value="+20">🇪🇬 +20</option>
                <option value="+254">🇰🇪 +254</option>
                <option value="+212">🇲🇦 +212</option>
                <option value="+41">🇨🇭 +41</option>
                <option value="+31">🇳🇱 +31</option>
                <option value="+46">🇸🇪 +46</option>
                <option value="+47">🇳🇴 +47</option>
                <option value="+45">🇩🇰 +45</option>
                <option value="+358">🇫🇮 +358</option>
                <option value="+48">🇵🇱 +48</option>
                <option value="+380">🇺🇦 +380</option>
                <option value="+30">🇬🇷 +30</option>
                <option value="+90">🇹🇷 +90</option>
                <option value="+972">🇮🇱 +972</option>
                <option value="+98">🇮🇷 +98</option>
                <option value="+64">🇳🇿 +64</option>
                <option value="+54">🇦🇷 +54</option>

                <option value="+57">🇨🇴 +57</option>
                <option value="+51">🇵🇪 +51</option>

              </select>
            </div>
            <div class="phone-number-wrap">
              <input type="tel" id="phone-number" class="form-control" placeholder="9876543210" required inputmode="numeric" autocomplete="tel-national">
            </div>
          </div>
          <small class="otp-notice" style="margin-top:6px;">Enter your number without the country code.</small>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="phone-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-phone-pwd1"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-group">
            <i class="fas fa-check-double input-icon"></i>
            <input type="password" id="phone-confirm" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye-icon" id="toggle-phone-pwd2"></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="phone-reg-btn">
          <i class="fas fa-paper-plane"></i> Send SMS OTP
        </button>
      </form>

      <!-- Step 2: Phone OTP Verification -->
      <form id="phone-otp-form" style="display: none;">
        <div class="form-group">
          <label>SMS Verification Code</label>
          <div class="input-group">
            <i class="fas fa-key input-icon"></i>
            <input type="text" id="phone-otp" class="form-control" placeholder="123456" required maxlength="6" pattern="\d{6}" inputmode="numeric" autocomplete="one-time-code">
          </div>
          <small class="otp-notice" id="phone-otp-notice">A 6-digit code has been sent to your mobile number.</small>
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="phone-otp-btn">
          <i class="fas fa-unlock-keyhole"></i> Verify Account
        </button>
        <div class="otp-actions">
          <button type="button" class="btn btn-secondary" id="resend-phone-otp-btn">
            <i class="fas fa-rotate"></i> Resend OTP <span id="phone-cooldown-timer">(60s)</span>
          </button>
          <button type="button" class="btn btn-secondary" id="change-phone-btn">
            <i class="fas fa-pen"></i> Change Number
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Already registered? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (getToken() && getUser()) {
        window.location.href = 'dashboard.html';
      }

      // ── Password Toggle Helper ────────────────────────────────────
      const setupToggle = (toggleId, inputId) => {
        const el = document.getElementById(toggleId);
        if (!el) return;
        el.addEventListener('click', function () {
          const input = document.getElementById(inputId);
          if (input.type === 'password') {
            input.type = 'text';
            this.classList.replace('fa-eye', 'fa-eye-slash');
          } else {
            input.type = 'password';
            this.classList.replace('fa-eye-slash', 'fa-eye');
          }
        });
      };
      setupToggle('toggle-pwd1', 'reg-password');
      setupToggle('toggle-pwd2', 'reg-confirm');
      setupToggle('toggle-phone-pwd1', 'phone-password');
      setupToggle('toggle-phone-pwd2', 'phone-confirm');

      // ── Method Tab Switching ──────────────────────────────────────
      window.switchMethod = (method) => {
        const emailSection = document.getElementById('email-section');
        const phoneSection = document.getElementById('phone-section');
        const tabEmail = document.getElementById('tab-email');
        const tabPhone = document.getElementById('tab-phone');
        const subtitle = document.getElementById('brand-subtitle');

        if (method === 'email') {
          emailSection.style.display = 'block';
          phoneSection.style.display = 'none';
          tabEmail.classList.add('active');
          tabPhone.classList.remove('active');
          subtitle.textContent = 'Register as a new CyberShield Security Analyst';
        } else {
          emailSection.style.display = 'none';
          phoneSection.style.display = 'block';
          tabEmail.classList.remove('active');
          tabPhone.classList.add('active');
          subtitle.textContent = 'Register with your mobile number';
        }
      };

      // ── Countdown Timer Helper ────────────────────────────────────
      const startCountdown = (btnId, timerId, seconds = 60) => {
        const btn = document.getElementById(btnId);
        const timerSpan = document.getElementById(timerId);
        btn.disabled = true;
        let remaining = seconds;
        timerSpan.textContent = `(${remaining}s)`;
        const interval = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(interval);
            timerSpan.textContent = '';
            btn.disabled = false;
          } else {
            timerSpan.textContent = `(${remaining}s)`;
          }
        }, 1000);
        return interval;
      };

      // ══════════════════════════════════════════════════════
      // EMAIL REGISTRATION FLOW (existing — unchanged logic)
      // ══════════════════════════════════════════════════════
      let registeredEmail = '';
      let emailTimerInterval = null;

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;

        if (password !== confirm) {
          showToast('Passwords do not match', 'warning');
          return;
        }

        btn.classList.add('btn-loading');
        btn.disabled = true;

        try {
          const data = await apiRequest('/auth/register', 'POST', { username, email, password });
          if (data.success) {
            registeredEmail = email;
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('otp-form').style.display = 'block';
            document.getElementById('brand-subtitle').textContent = `Enter the 6-digit code sent to ${email}`;
            document.getElementById('otp-sent-notice').textContent = `A 6-digit code has been sent to ${email}`;
            showToast(data.message || 'Verification code sent to your email.', 'success');
            emailTimerInterval = startCountdown('resend-otp-btn', 'cooldown-timer', 60);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Unable to send verification code. Please try again.', 'danger');
        }
      });

      document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('otp-btn');
        const otp = document.getElementById('reg-otp').value.trim();
        btn.classList.add('btn-loading');
        btn.disabled = true;
        try {
          const data = await apiRequest('/auth/verify-otp', 'POST', { email: registeredEmail, otp });
          if (data.success && data.token) {
            setToken(data.token, false);
            if (data.user) setUser(data.user, false);
            btn.innerHTML = '<i class="fas fa-check"></i> Verified!';
            btn.style.background = 'linear-gradient(135deg,#00c896,#00a077)';
            showToast('Account verified! Accessing SOC...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Invalid verification code.', 'danger');
        }
      });

      document.getElementById('resend-otp-btn').addEventListener('click', async () => {
        const btn = document.getElementById('resend-otp-btn');
        btn.classList.add('btn-loading');
        try {
          const resData = await apiRequest('/auth/resend-otp', 'POST', { email: registeredEmail });
          showToast(resData.message || 'Verification code sent to your email.', 'success');
          if (emailTimerInterval) clearInterval(emailTimerInterval);
          emailTimerInterval = startCountdown('resend-otp-btn', 'cooldown-timer', 60);
        } catch (err) {
          showToast(err.message || 'Unable to resend code. Please try again.', 'danger');
          btn.disabled = false;
        } finally {
          btn.classList.remove('btn-loading');
        }
      });

      document.getElementById('change-email-btn').addEventListener('click', () => {
        if (emailTimerInterval) clearInterval(emailTimerInterval);
        document.getElementById('otp-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('brand-subtitle').textContent = 'Register as a new CyberShield Security Analyst';
        const btn = document.getElementById('reg-btn');
        btn.classList.remove('btn-loading');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Email OTP';
      });

      // ══════════════════════════════════════════════════════
      // PHONE REGISTRATION FLOW (new)
      // ══════════════════════════════════════════════════════
      let registeredPhone = '';
      let phoneTimerInterval = null;

      // Build full E.164 phone number from country code + local number
      const buildE164 = () => {
        const cc = document.getElementById('country-code').value; // e.g. "+91"
        const num = document.getElementById('phone-number').value.trim().replace(/\D/g, '');
        return cc + num;
      };

      document.getElementById('register-phone-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('phone-reg-btn');
        const username = document.getElementById('phone-username').value.trim();
        const phoneNumber = buildE164();
        const password = document.getElementById('phone-password').value;
        const confirm = document.getElementById('phone-confirm').value;

        if (password !== confirm) {
          showToast('Passwords do not match', 'warning');
          return;
        }

        // Basic length sanity check
        if (phoneNumber.replace('+', '').length < 8) {
          showToast('Invalid phone number. Please enter the full number.', 'warning');
          return;
        }

        btn.classList.add('btn-loading');
        btn.disabled = true;

        try {
          const data = await apiRequest('/auth/register-phone', 'POST', { username, phoneNumber, password });
          if (data.success) {
            registeredPhone = phoneNumber;
            document.getElementById('register-phone-form').style.display = 'none';
            document.getElementById('phone-otp-form').style.display = 'block';
            const masked = phoneNumber.slice(0, 4) + '••••••' + phoneNumber.slice(-2);
            document.getElementById('brand-subtitle').textContent = `Enter the 6-digit code sent to ${masked}`;
            document.getElementById('phone-otp-notice').textContent = `A 6-digit SMS code has been sent to ${masked}`;
            showToast(data.message || 'Verification code sent to your mobile.', 'success');
            phoneTimerInterval = startCountdown('resend-phone-otp-btn', 'phone-cooldown-timer', 60);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Unable to send SMS. Please try again.', 'danger');
        }
      });

      document.getElementById('phone-otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('phone-otp-btn');
        const otp = document.getElementById('phone-otp').value.trim();
        btn.classList.add('btn-loading');
        btn.disabled = true;
        try {
          const data = await apiRequest('/auth/verify-phone-otp', 'POST', { phoneNumber: registeredPhone, otp });
          if (data.success && data.token) {
            setToken(data.token, false);
            if (data.user) setUser(data.user, false);
            btn.innerHTML = '<i class="fas fa-check"></i> Verified!';
            btn.style.background = 'linear-gradient(135deg,#00c896,#00a077)';
            showToast('Account verified! Accessing SOC...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
          document.querySelector('.auth-card').classList.add('shake');
          setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 400);
          showToast(err.message || 'Invalid verification code.', 'danger');
        }
      });

      document.getElementById('resend-phone-otp-btn').addEventListener('click', async () => {
        const btn = document.getElementById('resend-phone-otp-btn');
        btn.classList.add('btn-loading');
        try {
          const resData = await apiRequest('/auth/resend-phone-otp', 'POST', { phoneNumber: registeredPhone });
          showToast(resData.message || 'Verification code sent to your mobile.', 'success');
          if (phoneTimerInterval) clearInterval(phoneTimerInterval);
          phoneTimerInterval = startCountdown('resend-phone-otp-btn', 'phone-cooldown-timer', 60);
        } catch (err) {
          showToast(err.message || 'Unable to resend code. Please try again.', 'danger');
          btn.disabled = false;
        } finally {
          btn.classList.remove('btn-loading');
        }
      });

      document.getElementById('change-phone-btn').addEventListener('click', () => {
        if (phoneTimerInterval) clearInterval(phoneTimerInterval);
        document.getElementById('phone-otp-form').style.display = 'none';
        document.getElementById('register-phone-form').style.display = 'block';
        document.getElementById('brand-subtitle').textContent = 'Register with your mobile number';
        const btn = document.getElementById('phone-reg-btn');
        btn.classList.remove('btn-loading');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send SMS OTP';
      });
    });
  </script>
</body>
</html>
