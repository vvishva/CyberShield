services:
  # Node.js Express Backend
  - type: web
    name: cybershield-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false  # You will set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Generate a secure secret: openssl rand -base64 32
      - key: PYTHON_AI_URL
        sync: false  # You will set this after deploying Flask service
      - key: NODE_ENV
        value: production

  # Python Flask AI Microservice
  - type: web
    name: cybershield-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: python app.py
    rootDir: python-ai
    envVars:
      - key: PORT
        value: 5001
