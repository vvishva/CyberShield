name: CyberShield CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_for_testing_only_32chars!!
          MONGO_URI: mongodb://localhost:27017/cybershield_test
          PYTHON_AI_URL: http://localhost:5001/predict-url
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  python-ai-tests:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./python-ai
        run: pip install -r requirements.txt

      - name: Train model (smoke test)
        working-directory: ./python-ai
        run: python train_model.py
        timeout-minutes: 10

      - name: Test model loading
        working-directory: ./python-ai
        run: |
          python -c "
          import joblib
          model = joblib.load('phishing_model.pkl')
          print('Model loaded successfully')
          print(f'Model type: {type(model).__name__}')
          print(f'Classes: {model.classes_}')
          print(f'Features: {model.n_features_in_}')
          "

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  build-and-deploy:
    name: Build & Deploy
    needs: [lint-and-format, backend-tests, python-ai-tests, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Backend)
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}

      - name: Deploy to Render (Python AI)
        if: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          curl -X POST ${{ secrets.RENDER_AI_DEPLOY_HOOK }}

      - name: Notify deployment
        run: |
          echo "✅ CyberShield deployed successfully!"
          echo "Backend: https://cybershield-backend-uhwn.onrender.com"
          echo "AI Service: https://cybershield-ai.onrender.com"